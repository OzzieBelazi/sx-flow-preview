<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes" />
<title>Verification Architecture — TEXT / CODE / GAP + Haikai integration</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/style.css" />
<style>
  :root {
    --bg:#0f1117; --panel:#1b1f29; --panel2:#252b38; --border:#2e3548;
    --txt:#e8ecf3; --muted:#9aa3b2;
    /* tag colours */
    --T:#38bdf8;   /* TEXT     — cyan   (.md / YAML / instruction)  */
    --C:#8b5cf6;   /* CODE     — purple (deterministic Python/SQL)  */
    --G:#ef4444;   /* GAP      — red    (unspecified in spec)       */
    --K:#22c55e;   /* CLOSED   — green  (was a gap, closed by haikai)*/
    --H:#f97316;   /* HAIKAI   — orange (primitive from haikai)     */
    --S:#f59e0b;   /* STATE    — amber  (jobs.db)                    */
    --L:#475569;   /* LAYER    — slate  (group label)                */
    --accent:#4da6ff;
  }
  *{box-sizing:border-box}
  html,body,#root{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .tabs{position:absolute;top:8px;left:8px;right:8px;z-index:25;display:flex;gap:6px;flex-wrap:wrap;background:rgba(15,17,23,.85);backdrop-filter:blur(8px);padding:6px;border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.45);}
  .tab{flex:1 1 160px;min-height:44px;padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-size:13px;cursor:pointer;text-align:center;font-weight:500;line-height:1.2;}
  .tab:active{transform:scale(.97);}
  .tab.active{background:linear-gradient(180deg,#3a3f52,#2a2f3e);border-color:#5b6480;box-shadow:inset 0 0 0 1px var(--accent);}
  .tab small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px;}

  .player{position:absolute;top:108px;left:8px;right:8px;z-index:24;background:rgba(15,17,23,.92);backdrop-filter:blur(8px);padding:8px 10px;border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;gap:6px;}
  .player .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .btn{min-width:42px;min-height:36px;padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-size:14px;cursor:pointer;font-weight:600;}
  .btn:active{transform:scale(.96);}
  .btn.primary{background:linear-gradient(180deg,#3a86ff,#2c6bd9);border-color:#5b9dff;color:#fff;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .player select{background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;}
  .progress{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--border);}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--T),var(--C),var(--H));transition:width .4s ease;}
  .step-label{font-size:12.5px;color:var(--txt);line-height:1.35;}
  .step-label .num{color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;margin-right:6px;}
  .scen-desc{font-size:12px;color:var(--muted);line-height:1.35;}

  .legend{position:absolute;bottom:10px;left:8px;z-index:20;background:rgba(15,17,23,.85);backdrop-filter:blur(8px);padding:6px 10px;border:1px solid var(--border);border-radius:10px;font-size:11.5px;display:flex;gap:8px;flex-wrap:wrap;}
  .legend .chip{display:inline-flex;align-items:center;gap:5px;}
  .legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}

  .info{position:absolute;right:8px;top:8px;z-index:30;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;max-width:320px;font-size:13px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .info h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px;}
  .info .tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;color:#0f1117;}
  .info p{margin:6px 0 0;color:var(--muted);}
  .info .close{position:absolute;top:6px;right:8px;background:transparent;border:0;color:var(--muted);font-size:18px;cursor:pointer;}

  .node-box{padding:8px 10px;border-radius:8px;border:1.5px solid;background:var(--panel);color:var(--txt);font-size:12px;line-height:1.25;min-width:150px;max-width:260px;text-align:center;cursor:pointer;transition:opacity .25s,filter .25s,box-shadow .25s;position:relative;}
  .node-box:hover{filter:brightness(1.15);}
  .node-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.4px;margin-bottom:4px;color:#0f1117;}
  .node-label{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;}
  .node-sub{font-size:10.5px;color:var(--muted);margin-top:3px;font-family:ui-monospace,Menlo,Consolas,monospace;}
  .node-T{border-color:var(--T);} .tag-T{background:var(--T);}
  .node-C{border-color:var(--C);} .tag-C{background:var(--C);}
  .node-G{border-color:var(--G);} .tag-G{background:var(--G);color:#fff;}
  .node-K{border-color:var(--K);} .tag-K{background:var(--K);}
  .node-H{border-color:var(--H);} .tag-H{background:var(--H);}
  .node-S{border-color:var(--S);} .tag-S{background:var(--S);}
  .node-L{border-color:var(--L);background:transparent;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;} .tag-L{background:var(--L);color:#fff;}

  .node-pending{opacity:.18;}
  .node-active{animation:pulse 1.2s ease-in-out infinite;box-shadow:0 0 0 0 rgba(77,166,255,.7);}
  .node-done{opacity:1;filter:saturate(.85);}
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0   rgba(77,166,255,.55); }
    70%  { box-shadow: 0 0 0 12px rgba(77,166,255,0);   }
    100% { box-shadow: 0 0 0 0   rgba(77,166,255,0);   }
  }
  .react-flow__edge.pending path{stroke-opacity:.12;}
  .react-flow__edge.active path{stroke-width:3px;}
  .react-flow__edge.done path{stroke-opacity:.95;}
  .react-flow__attribution{background:transparent!important;color:var(--muted)!important;font-size:10px;}
  @media (max-width:640px){
    .tab{flex:1 1 45%;font-size:12.5px;min-height:42px;}
    .info{max-width:calc(100vw - 16px);}
    .player{top:104px;}
  }
</style>
</head>

//   S = STATE STORE — jobs.db
//   L = LAYER LABEL (group header, non-interactive)
//
// Companion to the diagram-app diagram07 (flow-style scenarios) and
// diagram10 (TEXT/CODE/GAP without haikai). This single-file build is

  E('g4','disc-C','disc-G',       '', 'G'),
];

const TAG_COLOR = { T:'#38bdf8', C:'#8b5cf6', G:'#ef4444', K:'#22c55e', H:'#f97316', S:'#f59e0b', L:'#475569' };
const TAG_LABEL = {
  T:'TEXT — markdown / YAML / instruction',
  C:'CODE — deterministic Python / SQL / I/O',
  G:'GAP — not specified in the spec',
  K:'CLOSED — was a gap, closed by haikai',
  H:'HAIKAI — primitive from SpecForgeAI/haikai-skills',
  S:'STATE STORE — jobs.db',
  L:'LAYER LABEL',
};
const TAG_TEXT = { T:'TEXT', C:'CODE', G:'GAP', K:'CLOSED', H:'HAIKAI', S:'STORE', L:'LAYER' };

function FlowNode({ data }) {
  let state = data.state || 'pending';
  const cls = 'node-box node-' + data.tag + ' node-' + state;
  const tagCls = 'node-tag tag-' + data.tag;
  return h('div', { className: cls, style:{ minWidth: data.w || 150 }, onClick:(e)=>{ e.stopPropagation(); data.onSelect(data.nodeId); } },
    h(Handle, { type:'target', position:Position.Top, style:{ background:'#555' } }),
    h('div', { className: tagCls }, TAG_TEXT[data.tag] || data.tag),
    h('div', { className: 'node-label' }, data.label.split('\n').map((l,i)=>h(React.Fragment,{key:i}, i?h('br'):null, l))),
    data.sub ? h('div', { className: 'node-sub' }, data.sub) : null,
    h(Handle, { type:'source', position:Position.Bottom, style:{ background:'#555' } })
  );
}
const nodeTypes = { flow: FlowNode };

function edgeColor(kind, sourceTag, targetTag) {
  // edges may declare a "kind" (T/C/G/K/H/S) which overrides
  if (kind && TAG_COLOR[kind]) return TAG_COLOR[kind];
  if (sourceTag && sourceTag !== 'L') return TAG_COLOR[sourceTag];
  if (targetTag && targetTag !== 'L') return TAG_COLOR[targetTag];
  return '#7a8294';
}

const S = (label, nodes, edges) => ({ label, nodes, edges });
const SCENARIOS = {
  overview: {
    name:'Overview', sub:'everything · interactive',
    desc:'Every layer of the async-verification spec, split into TEXT / CODE / GAP with the haikai column on the right. Tap any node for detail. Open gaps are red; gaps closed by adopting haikai are green.',
    steps: null,
  },
  architecture: {
    name:'Architecture', sub:'TEXT / CODE / GAP only',
    desc:'Just the structural split. Step through layer by layer to see how each one mixes markdown agents with deterministic code, and where the open design questions live.',
    steps: [
      S('Headers — three columns: TEXT (.md), CODE (Python/SQL), GAP (open)', ['hdr-T','hdr-C','hdr-G'], []),
      S('ENTRY — commands + dispatcher',          ['lbl-entry','entry-T','entry-C'], ['e1','e2']),
      S('ORCHESTRATOR LOOP — .py at S1, .md at S4, cancellation GAP',
        ['lbl-loop','loop-T','loop-C','loop-G'], ['g1']),
      S('VERIFIERS — inline, rubric, ci/observe — each a mini-cluster',
        ['lbl-verif','v-inline-T','v-inline-C','v-rubric-T','v-ci-C','v-ci-G'],
        ['e3','e4','e5','e6','g2']),
      S('STATE STORE — rubric .md feed in, guarded writes enforce invariants',
        ['lbl-state','state-T','state-S'], ['e7','e8','e9']),
      S('ASYNC / CI — inbound gateway + 5 D10.x decisions',
        ['lbl-async','async-T','async-C'], ['e10','e11']),
      S('REPAIR — D4 classifier + per-cell caps + per-job budget GAP',
        ['lbl-repair','repair-T','repair-C','repair-G'], ['e12','e13','g3']),
      S('DISCOVERY — side-channel, inventory + git-diff gate + build-tool GAP',
        ['lbl-disc','disc-T','disc-C','disc-G'], ['e14','g4']),
      S('CONFIG — coordination.yaml feeds state + loop',
        ['lbl-config','cfg-T','cfg-C'], ['e20','e21','e22']),
      S('OBSERVABILITY — read-side, parallel to S4/S5, operator-ack GAP',
        ['lbl-obs','obs-T','obs-C','obs-G'], ['e30','e31','e32','e33']),
    ],
  },
  haikai: {
    name:'Haikai integration', sub:'where each primitive plugs in',
    desc:'Walk through the haikai primitives and which layer of the verification spec each one slots into. Three direct wins, two probable, plus the spec-authoring use that does not live at runtime.',
    steps: [
      S('subagent-dispatch.md — depth=1, retry-feedback — verification-loop should cite, not reinvent',
        ['h-dispatch','loop-T'], ['h1']),
      S('/haikai:reason — generate→critique→synthesize→judge IS the rubric agreement protocol — CLOSES the open gap',
        ['h-reason','v-rubric-K'], ['h3']),
      S('/haikai:fix — worktree-per-group + retry-feedback — replaces the custom fix-task builder',
        ['h-fix','repair-C'], ['h4']),
      S('/haikai:debug — bug-hunting loop — D4 four-way classifier shape',
        ['h-debug','repair-T'], ['h5']),
      S('/haikai:predict — multi-persona swarm — exactly what drift-triager needs',
        ['h-predict','repair-T'], ['h6']),
      S('/haikai:learn — parallel readers + docs-manager — discovery-interpreter pattern',
        ['h-learn','disc-T'], ['h7']),
      S('haikai rubrics format — /create-rubrics should adopt it so rubrics speak one dialect',
        ['h-rubrics-fmt','cfg-T'], ['h8']),
      S('/haikai:scenario — could enumerate the cancellation matrix the spec waves at',
        ['h-scen','loop-G'], ['h2']),
      S('Spec authoring (author-time, not runtime) — /haikai:grill stress-tests the plan',
        ['lbl-auth','h-grill'], []),
      S('Spec authoring — /haikai:security STRIDE would have driven D10.4 systematically',
        ['h-sec'], []),
    ],
  },
  gaps: {
    name:'Gaps', sub:'what is open · what haikai closes',
    desc:'Five open gaps in the spec. One closed by adopting a haikai primitive directly; one partially addressed (enumeration); three still open. Step through them.',
    steps: [
      S('GAP 1 — cancellation semantics (orchestrator loop). Spec is silent.',
        ['loop-G'], ['g1']),
      S('… partially closed by /haikai:scenario (enumerate the matrix at author-time)',
        ['loop-G','h-scen'], ['h2']),
      S('GAP 2 — rubric agreement strategy (rubric verifier). Was open.',
        ['v-rubric-K'], []),
      S('… CLOSED by /haikai:reason — generate→critic→judge IS the protocol',
        ['v-rubric-K','h-reason'], ['h3']),
      S('GAP 3 — in-flight cell cancel on parent abort (ci/observe verifier). Still open.',
        ['v-ci-G'], ['g2']),
      S('GAP 4 — per-job global repair budget (repair). Per-cell caps exist; no orchestration-wide cap.',
        ['repair-G'], ['g3']),
      S('GAP 5 — build-tool allow-list extension point (discovery). Hardcoded today.',
        ['disc-G'], ['g4']),
      S('GAP 6 — operator ack for `verify: false` (observability). Humans miss SSE.',
        ['obs-G'], ['e33']),
    ],
  },
};

function App() {
  const [scenario, setScenario] = useState('overview');
  const [step, setStep] = useState(-1);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed] = useState(1400);
  const [selectedId, setSelectedId] = useState(null);
  const [follow, setFollow] = useState(true);
  const { setCenter } = useReactFlow();
  const sc = SCENARIOS[scenario];
  const hasSteps = !!sc.steps;
  const total = hasSteps ? sc.steps.length : 0;
  const tagById = useMemo(()=> Object.fromEntries(NODES.map(n=>[n.id,n.tag])), []);

  useEffect(() => { setStep(-1); setPlaying(false); }, [scenario]);

  useEffect(() => {
    if (!playing || !hasSteps) return;
    if (step >= total - 1) { setPlaying(false); return; }
    const t = setTimeout(() => setStep(s => Math.min(total - 1, s + 1)), speed);
    return () => clearTimeout(t);
  }, [playing, step, total, hasSteps, speed]);

  useEffect(() => {
    if (!follow || !hasSteps || step < 0) return;
    const ids = sc.steps[step].nodes || [];
    if (!ids.length) return;
    let sx = 0, sy = 0, n = 0;
    ids.forEach(id => {
      const nd = NODES.find(x => x.id === id);
      if (nd) { sx += nd.x + 80; sy += nd.y + 35; n++; }
    });
    if (n > 0) setCenter(sx/n, sy/n, { duration: 700, zoom: 0.75 });
  }, [step, scenario, follow, hasSteps, setCenter]);

  const { nodeState, edgeState } = useMemo(() => {
    const ns = {}; const es = {};
    if (!hasSteps) {
      NODES.forEach(n => ns[n.id] = 'done');
      EDGES.forEach(e => es[e.id] = 'done');
    } else {
      NODES.forEach(n => ns[n.id] = 'pending');
      EDGES.forEach(e => es[e.id] = 'pending');
      if (step >= 0) {
        for (let i = 0; i < step; i++) {
          (sc.steps[i].nodes || []).forEach(id => ns[id] = 'done');
          (sc.steps[i].edges || []).forEach(id => es[id] = 'done');
        }
        (sc.steps[step].nodes || []).forEach(id => ns[id] = 'active');
        (sc.steps[step].edges || []).forEach(id => es[id] = 'active');
      }
    }
    return { nodeState: ns, edgeState: es };
  }, [scenario, step, hasSteps]);

  const visualNodeState = (id) => hasSteps ? nodeState[id] : 'visible';

  const nodes = useMemo(() => NODES.map(n => ({
    id: n.id, type:'flow', position:{ x:n.x, y:n.y },
    data: { tag:n.tag, label:n.label, sub:n.sub, w:n.w, state: visualNodeState(n.id), nodeId:n.id, onSelect:setSelectedId },
    draggable: true,
  })), [nodeState, hasSteps]);

  const edges = useMemo(() => EDGES.map(e => {
    const st = edgeState[e.id];
    const col = edgeColor(e.kind, tagById[e.source], tagById[e.target]);
    const isHaikai = e.kind === 'H';
    return {
      id:e.id, source:e.source, target:e.target, label:e.label,
      className: st,
      animated: st === 'active' || isHaikai,
      markerEnd:{ type:MarkerType.ArrowClosed, color:col, width:18, height:18 },
      style:{ stroke:col, strokeWidth: st === 'active' ? 3 : (st === 'done' ? 2 : 1.4), strokeDasharray: e.kind === 'G' ? '4 3' : undefined },
      labelStyle:{ fill:'#e8ecf3', fontSize:10 },
      labelBgStyle:{ fill:'#1b1f29' }, labelBgPadding:[4,2], labelBgBorderRadius:4,
    };
  }), [edgeState, tagById]);

  const sel = selectedId ? NODES.find(n=>n.id===selectedId) : null;

  const onPlay = () => {
    if (!hasSteps) return;
    if (step >= total - 1) setStep(0);
    else if (step < 0) setStep(0);
    setPlaying(true);
  };
  const onPause = () => setPlaying(false);
  const onReset = () => { setPlaying(false); setStep(-1); };
  const onPrev = () => { setPlaying(false); setStep(s => Math.max(0, (s < 0 ? 0 : s - 1))); };
  const onNext = () => { setPlaying(false); setStep(s => Math.min(total - 1, s + 1)); };

  const progressPct = !hasSteps ? 100 : (step < 0 ? 0 : ((step + 1) / total) * 100);
  const stepLabel = !hasSteps
    ? 'Tap any node to inspect it.'
    : (step < 0 ? 'Ready. Tap ▶ to step through this scenario.' : `${sc.steps[step].label}`);

  return h(React.Fragment, null,
    h('div', { className:'tabs' },
      Object.entries(SCENARIOS).map(([k,v]) =>
        h('button', { key:k, className:'tab' + (k===scenario?' active':''), onClick:()=>{ setScenario(k); setSelectedId(null); } },
          v.name, h('small', null, v.sub)
        )
      )
    ),
    h('div', { className:'player' },
      h('div', { className:'scen-desc' }, sc.desc),
      h('div', { className:'row' },
        playing
          ? h('button', { className:'btn primary', onClick:onPause, disabled:!hasSteps }, '⏸ Pause')
          : h('button', { className:'btn primary', onClick:onPlay, disabled:!hasSteps }, '▶ Play'),
        h('button', { className:'btn', onClick:onPrev, disabled:!hasSteps || step <= 0 }, '⏮'),
        h('button', { className:'btn', onClick:onNext, disabled:!hasSteps || step >= total - 1 }, '⏭'),
        h('button', { className:'btn', onClick:onReset, disabled:!hasSteps || step < 0 }, '⟲'),
        h('select', { value:speed, onChange:(e)=>setSpeed(parseInt(e.target.value,10)) },
          h('option',{value:2200},'0.5×'),
          h('option',{value:1400},'1×'),
          h('option',{value:800}, '2×'),
          h('option',{value:450}, '3×'),
        ),
        h('button', { className:'btn' + (follow?' primary':''), onClick:()=>setFollow(f=>!f), title:'Auto-pan to follow active step' }, follow ? '👁 Follow' : '👁 Off'),
        h('div', { style:{flex:1,minWidth:80} }),
        hasSteps && h('div', { className:'step-label' },
          h('span',{className:'num'}, (step<0?0:step+1) + '/' + total),
          stepLabel
        ),
        !hasSteps && h('div', { className:'step-label' }, stepLabel),
      ),
      h('div', { className:'progress' }, h('div', { style:{ width: progressPct + '%' } }))
    ),
    sel && h('div', { className:'info' },
      h('button',{className:'close',onClick:()=>setSelectedId(null)},'×'),
      h('h4', null,
        h('span',{className:'tag tag-'+sel.tag, style:{background:TAG_COLOR[sel.tag]}}, TAG_TEXT[sel.tag] || sel.tag),
        ' ', sel.label.replace(/\n/g,' ')
      ),
      h('div', { style:{fontSize:11,color:'var(--muted)',marginTop:2} }, TAG_LABEL[sel.tag]),
      h('p', null, sel.info)
    ),
    h('div', { className:'legend' },
      h('span',{className:'chip'}, h('span',{className:'dot',style:{background:'var(--T)'}}),' TEXT (.md/YAML)'),
      h('span',{className:'chip'}, h('span',{className:'dot',style:{background:'var(--C)'}}),' CODE (Python/SQL)'),
      h('span',{className:'chip'}, h('span',{className:'dot',style:{background:'var(--S)'}}),' STATE (jobs.db)'),
      h('span',{className:'chip'}, h('span',{className:'dot',style:{background:'var(--G)'}}),' GAP (open)'),
      h('span',{className:'chip'}, h('span',{className:'dot',style:{background:'var(--K)'}}),' CLOSED (by haikai)'),
      h('span',{className:'chip'}, h('span',{className:'dot',style:{background:'var(--H)'}}),' HAIKAI primitive'),
    ),
    h(ReactFlow, {
      nodes, edges, nodeTypes,
      fitView:true, fitViewOptions:{ padding:0.20 },
      minZoom:0.08, maxZoom:1.5,
      onPaneClick:()=>setSelectedId(null),
      panOnScroll:false, zoomOnPinch:true, panOnDrag:true,
      proOptions:{ hideAttribution:false },
    },
      h(Background, { color:'#2b3142', gap:24, size:1 }),
      h(Controls, { showInteractive:false }),
      h(MiniMap, { pannable:true, zoomable:true, maskColor:'rgba(15,17,23,.7)', nodeColor:(n)=>TAG_COLOR[n.data?.tag] || '#888', style:{ background:'#1b1f29', border:'1px solid var(--border)' } })
    )
  );
}

createRoot(document.getElementById('root')).render(
  h(ReactFlowProvider, null, h(App))
);
</script>
</body>
</html>
